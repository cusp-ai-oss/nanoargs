[project]
name = "nanoargs"
version = "0.1.1"
description = "A tiny config loader and CLI framework built around Pydantic models"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Jonas Köhler", email = "jonas@cusp.ai" },
    { name = "CuspAI OpenSource Team", email = "opensource@cusp.ai" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.2",
    "pydantic>=2.10; python_version<'3.14'",
    "pydantic>=2.12; python_version>='3.14'",
    "pyyaml>=6.0.2",
    "rich>=13.0",
    "rich-argparse>=1.6",
]

[project.urls]
Homepage = "https://github.com/cusp-ai-oss/nanoargs"
Repository = "https://github.com/cusp-ai-oss/nanoargs"
Issues = "https://github.com/cusp-ai-oss/nanoargs/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
docs = ["mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]
dev = ["ipykernel>=6.30.1", "pre-commit>=3.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
